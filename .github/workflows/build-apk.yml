name: Build KasKita Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK (Android 10 - 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositori
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Siapkan Android 17 SDK (API 37)
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          "$SDK_MANAGER" "platforms;android-37" "build-tools;36.0.0"

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile Release APK
        run: gradle assembleRelease --no-daemon

      - name: Siapkan File APK Final
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Menemukan APK: $APK_PATH"
          cp "$APK_PATH" dist/KasKita-v1.0.0-by-ylowstone.apk

      - name: Upload APK ke GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KasKita-Android-APK
          path: dist/KasKita-v1.0.0-by-ylowstone.apk
          retention-days: 90
